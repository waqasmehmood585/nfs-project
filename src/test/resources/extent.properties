#Configuration
extent.reporter.spark.config=src/test/resources/extent-config.xml

#BaseFolder
basefolder.name= Automation-Results/Report 
basefolder.datetimepattern=dd-MMM-YYYY - HH-mm-ss-a

#HTML
extent.reporter.spark.start=true
extent.reporter.spark.out=Report.html

